name: Turnip (Linux)

# Linux (glibc) builds of Turnip for the SteamOS runtime, the driver Steam, gamescope and the games
# draw with. Built natively on an arm64 runner; each variant is an artifact, and optionally a
# release of this repository the app can download from.
on:
  # A change to the build itself test-builds it with the defaults; nothing is released.
  push:
    paths:
      - linux/turnip/**
      - .github/workflows/turnip-linux.yml
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: Mesa branch, tag or commit
        default: main
      mesa_repo:
        description: Mesa repository
        default: https://gitlab.freedesktop.org/mesa/mesa.git
      gen8_ref:
        description: Branch, tag or commit of the gen8 fork, for a8xx
        default: gen8
      variants:
        description: Comma-separated variants (a7xx, a8xx, a6xx)
        default: a7xx,a8xx,a6xx
      release:
        description: Publish the zips as a release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.v.outputs.variants }}
    steps:
      - id: v
        run: echo "variants=$(jq -cn --arg v '${{ inputs.variants || 'a7xx,a8xx,a6xx' }}' '$v | split(",") | map(gsub(" "; "")) | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.plan.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git ninja-build pkg-config python3-pip bison flex \
            glslang-tools zip cmake libffi-dev libxml2-dev libexpat1-dev zlib1g-dev libzstd-dev libudev-dev libelf-dev \
            libwayland-dev wayland-protocols libwayland-bin \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxrandr-dev libxshmfence-dev libxxf86vm-dev \
            libxcb1-dev libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxcb-shm0-dev libxcb-keysyms1-dev >/dev/null
          sudo pip3 install --break-system-packages -q 'meson>=1.4' mako pyyaml packaging
          # Mesa main wants wayland-scanner >= 1.23; Ubuntu 24.04 has 1.22.
          git clone -q --depth 1 -b 1.24.0 https://gitlab.freedesktop.org/wayland/wayland.git /tmp/wayland
          meson setup /tmp/wayland/build /tmp/wayland --prefix /usr/local -Ddocumentation=false -Dtests=false -Ddtd_validation=false
          sudo ninja -C /tmp/wayland/build install
          sudo ldconfig
          pkg-config --modversion wayland-scanner

      - name: Build
        run: |
          if [ "${{ matrix.variant }}" = a8xx ]; then
            linux/turnip/build.sh a8xx https://github.com/whitebelyash/mesa-tu8.git "${{ inputs.gen8_ref || 'gen8' }}" out
          else
            linux/turnip/build.sh "${{ matrix.variant }}" "${{ inputs.mesa_repo || 'https://gitlab.freedesktop.org/mesa/mesa.git' }}" "${{ inputs.mesa_ref || 'main' }}" out
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: turnip-linux-${{ matrix.variant }}
          path: out/*.zip

  release:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - id: tag
        run: |
          # One release for the set; the variants can come from different Mesa trees and versions.
          echo "tag=turnip-linux-$(date -u +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Turnip Linux ${{ steps.tag.outputs.tag }}
          body: |
            Linux (glibc aarch64, KGSL) Turnip for the SteamOS runtime, with the runtime's KGSL patches.
            a7xx: Mesa ${{ inputs.mesa_ref }} (Adreno 7xx, Snapdragon 8 Gen 1-3).
            a8xx: the gen8 fork @ ${{ inputs.gen8_ref }} (Adreno 8xx, Snapdragon 8 Elite).
            a6xx: Mesa ${{ inputs.mesa_ref }}, no cached-coherent memory, sysmem rendering forced (Adreno 6xx).
            Each zip's meta.json names its exact Mesa commit and the oldest glibc it needs.
          files: out/*.zip

name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: 27.2.12479018
  BOX64_VERSION: v0.4.4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "cmake;3.22.1" >/dev/null

      # The two libraries the Linux session preloads are glibc aarch64 builds: they load into
      # gamescope, the Steam client and the games, never into the app. Built from source here and
      # shipped as assets, so the app refreshes them in an installed runtime on every launch.
      - name: Build the session's glibc preload libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu >/dev/null
          D=app/src/main/assets/linuxfs
          mkdir -p "$D"
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -pthread \
            -o "$D/libblsession.so" linux/preload/*.c -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/libblsession.so"
          # Static C++ runtime: Steam ships its own libstdc++ and rewrites LD_LIBRARY_PATH, so a
          # preload that pulled the system one in ahead of it would be a version conflict.
          aarch64-linux-gnu-g++ -shared -fPIC -O2 -Wall -Wno-attributes -Wno-nonnull-compare -pthread \
            -std=c++17 -static-libstdc++ -static-libgcc \
            -o "$D/libfakeinput.so" linux/fakeinput/fakeinput_steam.cpp -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/libfakeinput.so"
          NEED=$(aarch64-linux-gnu-readelf -d "$D/libfakeinput.so" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          for bad in libstdc++.so.6 libgcc_s.so.1; do
            if printf '%s\n' "$NEED" | grep -qx "$bad"; then
              echo "::error::libfakeinput.so links $bad - the C++ runtime must stay static"; exit 1
            fi
          done
          for sym in open openat ioctl read close poll; do
            aarch64-linux-gnu-nm -D --defined-only "$D/libfakeinput.so" | awk '{print $NF}' | grep -qx "$sym" \
              || { echo "::error::libfakeinput.so does not export $sym"; exit 1; }
          done
          for sym in socket bind getsockname statfs fallocate posix_fallocate; do
            aarch64-linux-gnu-nm -D --defined-only "$D/libblsession.so" | awk '{print $NF}' | grep -qx "$sym" \
              || { echo "::error::libblsession.so does not export $sym"; exit 1; }
          done
          ls -l "$D"

      # The patched gamescope, when its release for this linux/gamescope exists (gamescope.yml
      # publishes it); without one the runtime's own gamescope is used.
      - name: Stage the patched gamescope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="gamescope-3.16.29-$(find linux/gamescope -type f | sort | xargs cat | sha256sum | cut -c1-12)"
          if gh release download "$tag" -R "$GITHUB_REPOSITORY" -p gamescope.tzst -p gamescope.tzst.sha256 2>/dev/null; then
            sha256sum -c gamescope.tzst.sha256
            tar --use-compress-program=unzstd -xf gamescope.tzst -C app/src/main/assets/linuxfs
            test -f app/src/main/assets/linuxfs/usr/local/bin/gamescope
            rm gamescope.tzst gamescope.tzst.sha256
            echo "staged $tag"
          else
            echo "::notice::no $tag release yet; the APK uses the runtime's own gamescope"
          fi

      # Steam Deck mode's performance overlay: Valve's aarch64 mangoapp and the libraries it needs,
      # fetched from Valve's package mirrors and checked against the pinned sha256s.
      - name: Stage mangoapp
        run: |
          set -euo pipefail
          M=app/src/main/assets/linuxfs/usr/local/lib/mangoapp
          mkdir -p "$M" mango-pkgs
          grep -v '^#' linux/mangoapp/packages.txt | while read -r sum url; do
            [ -n "$url" ] || continue
            curl -fsSL --retry 3 -o mango-pkgs/pkg.tar.zst "$url"
            echo "$sum  mango-pkgs/pkg.tar.zst" | sha256sum -c -
            tar --use-compress-program=unzstd -xf mango-pkgs/pkg.tar.zst -C mango-pkgs
            rm mango-pkgs/pkg.tar.zst
          done
          install -m644 mango-pkgs/usr/bin/mangoapp "$M/mangoapp"
          for so in libfmt.so.10 libspdlog.so.1.13 libglfw.so.3 libtraceevent.so.1 libtracefs.so.1; do
            cp -L "mango-pkgs/usr/lib/$so" "$M/$so"
          done
          rm -rf mango-pkgs
          ls -l "$M"

      # Box64 runs x86_64 Proton for the games set to it: a glibc aarch64 build like the preloads,
      # staged into the runtime at every session start. Cached by version; a build takes minutes.
      - name: Cache Box64
        id: box64-cache
        uses: actions/cache@v4
        with:
          path: box64-out
          key: box64-${{ env.BOX64_VERSION }}-generic-box32

      - name: Build Box64
        if: steps.box64-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b "$BOX64_VERSION" https://github.com/ptitSeb/box64.git /tmp/box64
          cmake -S /tmp/box64 -B /tmp/box64/build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_ASM_COMPILER=aarch64-linux-gnu-gcc \
            -DARM_DYNAREC=ON -DBOX32=ON -DNOGIT=ON
          cmake --build /tmp/box64/build -j"$(nproc)" --target box64
          mkdir -p box64-out
          aarch64-linux-gnu-strip -o box64-out/box64 /tmp/box64/build/box64

      - name: Stage Box64
        run: |
          install -m 755 box64-out/box64 app/src/main/assets/linuxfs/box64
          file app/src/main/assets/linuxfs/box64 | grep -q "ARM aarch64" \
            || { echo "::error::box64 is not an aarch64 binary"; exit 1; }
          ls -l app/src/main/assets/linuxfs/box64

      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --tests 'com.steamoslite.util.*' --no-daemon

      # A session needs every one of these; a missing one only shows up on a device, as a black
      # screen or a silent failure. Also checks the compositor's JNI names match the Java class.
      - name: Check the APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          unzip -l "$APK" > contents.txt
          for f in lib/arm64-v8a/libbannerwayland.so lib/arm64-v8a/libslnative.so \
                   lib/arm64-v8a/libmain_hook.so lib/arm64-v8a/libhook_impl.so \
                   lib/arm64-v8a/libwayland-server.so lib/arm64-v8a/libffi.so \
                   lib/arm64-v8a/libpulseaudio.so lib/arm64-v8a/libpulsecore-13.0.so \
                   assets/linuxfs/libblsession.so assets/linuxfs/libfakeinput.so assets/linuxfs/box64 \
                   assets/linuxfs/usr/local/bin/bannerlator-session \
                   assets/turnip.tzst assets/pulseaudio.tzst assets/wayland/keymap.xkb; do
            grep -q " $f\$" contents.txt || { echo "::error::$f is missing from the APK"; exit 1; }
          done
          grep "lib/arm64-v8a/" contents.txt
          unzip -o -q "$APK" lib/arm64-v8a/libbannerwayland.so -d apk
          NM="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          # Into a file first: grep -q stops reading early, and under pipefail nm's SIGPIPE fails the step.
          "$NM" -D --defined-only apk/lib/arm64-v8a/libbannerwayland.so > syms.txt
          grep -q Java_com_steamoslite_wayland_WaylandCompositor_nativeStartWithSurface syms.txt \
            || { echo "::error::libbannerwayland.so does not export the com.steamoslite JNI names"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: steamos-lite-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
